name: CI Pipeline, Quality, Tests & Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-tests:
    name: Lint, Type-Check & Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .

      - name: Run Mypy static type checker
        run: mypy app tests

      - name: Run Pytest suite with coverage
        run: python -m pytest -v --cov=app

  docker-build-verify:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: quality-and-tests

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ml-serving-skeleton:ci .

      - name: Smoke test container (Non-root user & /health)
        run: |
          docker run -d -p 8000:8000 --name ci-ml-api ml-serving-skeleton:ci
          sleep 3
          CONTAINER_USER=$(docker exec ci-ml-api whoami)
          echo "Running as user: $CONTAINER_USER"
          if [ "$CONTAINER_USER" != "appuser" ]; then
            echo "Security check failed: container is not running as appuser"
            exit 1
          fi
          curl --fail http://127.0.0.1:8000/health
          docker stop ci-ml-api
          docker rm ci-ml-api
